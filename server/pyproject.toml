[project]
name = "support-agent-server"
version = "0.1.0"
description = "FastAPI server for Support Agent."
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "support-agent-core",
    "uvicorn",
]

[project.scripts]
support-agent = "server.cli:run"

[tool.uv.sources]
support-agent-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/server"]
