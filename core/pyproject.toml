[project]
name = "support-agent-core"
version = "0.1.0"
description = "Shared settings, logging and database layer for Support Agent."
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic",
    "pgvector",
    "psycopg[binary]",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy[asyncio]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core"]
