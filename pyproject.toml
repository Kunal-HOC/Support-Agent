# Workspace root for the Support Agent monorepo.
# Python packages live in core/ and server/ (later: agents/, mcp/).

[tool.uv.workspace]
members = ["core", "server"]

[dependency-groups]
dev = [
    "httpx",
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["core", "server"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = [".", "core/src", "server/src"]
explicit_package_bases = true
files = ["conftest.py", "testing_support.py", "core/src", "core/tests", "core/migrations", "server/src", "server/tests", "scripts", "tests"]

[[tool.mypy.overrides]]
module = ["pgvector.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests", "core/tests", "server/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
addopts = "--strict-markers"
markers = [
    "db: needs a real PostgreSQL + pgvector database (TEST_DATABASE_URL)",
]
